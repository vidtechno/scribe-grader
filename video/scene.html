<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --bg1:#fff7ed; --bg2:#ffe4e6; --ink:#1f2937; --muted:#6b7280; --red:#e11d48; --violet:#7c3aed; --sky:#0284c7; --green:#059669; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: "Liberation Sans", "DejaVu Sans", sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1080px; background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
  .abs { position: absolute; }
  .brand { left: 56px; top: 44px; font-weight: 800; font-size: 30px; letter-spacing: .04em; color: var(--red); }
  .tag { right: 56px; top: 40px; padding: 8px 20px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 26px; color: var(--muted); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .title { left: 0; right: 0; text-align: center; font-weight: 900; }
  .chip { padding: 14px 34px; border-radius: 28px; font-weight: 900; font-size: 76px; color: #fff; box-shadow: 0 14px 30px rgba(0,0,0,.18); }
  .row { left: 70px; width: 940px; height: 120px; border-radius: 30px; background: #fff; box-shadow: 0 12px 34px rgba(0,0,0,.09); display: flex; align-items: center; padding: 0 36px; gap: 26px; }
  .row .uz { width: 300px; font-size: 36px; font-weight: 700; color: var(--muted); }
  .row .arrow { font-size: 44px; color: #9ca3af; }
  .row .en { font-size: 58px; font-weight: 900; }
  .row .en b { color: var(--accent); }
  .sentence { left: 60px; width: 960px; text-align: center; font-size: 96px; font-weight: 900; }
  .sentence span { display: inline-block; }
  .compare { left: 70px; width: 940px; border-radius: 34px; background: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.1); padding: 28px 40px; font-size: 62px; font-weight: 800; display: flex; align-items: center; gap: 24px; }
  .bad { color: var(--red); text-decoration: line-through; text-decoration-thickness: 6px; }
  .good { color: var(--green); }
  .mark { font-size: 70px; }
  #caption { left: 56px; right: 56px; bottom: 74px; text-align: center; font-size: 42px; font-weight: 700; line-height: 1.25; color: var(--ink); background: rgba(255,255,255,.85); border-radius: 26px; padding: 18px 26px; }
  #bar { left: 0; bottom: 0; height: 14px; background: var(--red); }
</style></head>
<body><div id="stage">
  <div class="abs brand">SCORIFY</div>
  <div class="abs tag">Beginner · To be</div>

  <div id="intro" class="abs title" style="top:250px;">
    <div style="font-size:150px;line-height:1;">To be</div>
    <div style="display:flex;gap:34px;justify-content:center;margin-top:60px;">
      <div class="chip" id="c1" style="background:var(--violet)">am</div>
      <div class="chip" id="c2" style="background:var(--sky)">is</div>
      <div class="chip" id="c3" style="background:var(--green)">are</div>
    </div>
  </div>

  <div class="abs row" id="r1" style="top:230px;--accent:var(--violet)"><span class="uz">Men</span><span class="arrow">→</span><span class="en">I <b>am</b></span></div>
  <div class="abs row" id="r2" style="top:390px;--accent:var(--sky)"><span class="uz">U (erkak/ayol)</span><span class="arrow">→</span><span class="en">he <b>is</b>, she <b>is</b></span></div>
  <div class="abs row" id="r3" style="top:550px;--accent:var(--green)"><span class="uz">Biz, ular</span><span class="arrow">→</span><span class="en">we <b>are</b>, they <b>are</b></span></div>

  <div id="ex" class="abs sentence" style="top:330px;">
    <span id="w1">I</span> <span id="w2" style="color:var(--violet)">am</span> <span id="w3">a</span> <span id="w4">student.</span>
  </div>
  <div id="cmp1" class="abs compare" style="top:600px;"><span class="mark" style="color:var(--red)">✗</span><span class="bad">I student</span></div>
  <div id="cmp2" class="abs compare" style="top:600px;"><span class="mark" style="color:var(--green)">✓</span><span class="good">I am a student</span></div>

  <div id="caption" class="abs"></div>
  <div id="bar" class="abs"></div>
</div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const pop = (x) => { x = clamp(x); const c = 1.70158 + 1; return 1 + c * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2); };
const $ = (id) => document.getElementById(id);
let T = null; // { duration, marks: {name: seconds}, captions: [{from, to, text}] }
function show(el, p, dy = 40) { el.style.opacity = clamp(p * 1.4); el.style.transform = `translateY(${(1 - easeOut(p)) * dy}px) scale(${0.9 + 0.1 * Math.min(1.05, pop(p))})`; }
window.setTimeline = (t) => { T = t; };
window.renderAt = (t) => {
  const m = T.marks;
  // intro: the three chips pop in one by one, then fade away when the first row starts
  const introOut = 1 - clamp((t - (m.rows - 0.4)) / 0.4);
  $('intro').style.opacity = introOut; $('intro').style.display = introOut <= 0 ? 'none' : 'block';
  [['c1', 0.3], ['c2', 0.7], ['c3', 1.1]].forEach(([id, at]) => { const p = clamp((t - at) / 0.45); $(id).style.transform = `scale(${pop(p)})`; $(id).style.opacity = clamp(p * 3); });
  // rows (the table lifts up and fades when the example starts)
  const lift = easeOut(clamp((t - m.example) / 0.5));
  [['r1', m.r1, 0], ['r2', m.r2, 0], ['r3', m.r3, 0]].forEach(([id, at]) => {
    const p = clamp((t - at) / 0.5); const el = $(id);
    el.style.opacity = clamp(p * 1.5) * (1 - lift);
    el.style.transform = `translateY(${(1 - easeOut(p)) * 50 - lift * 120}px) scale(${0.92 + 0.08 * Math.min(1.05, pop(p))})`;
    const active = t >= at && t < at + 2.1; el.style.outline = active ? '6px solid var(--accent)' : '6px solid transparent';
  });
  // example sentence: words pop in
  const words = [['w1', m.example + 0.5], ['w2', m.example + 1.0], ['w3', m.example + 1.4], ['w4', m.example + 1.8]];
  $('ex').style.opacity = clamp((t - m.example) / 0.3) * (1 - clamp((t - m.compare - 0.3) / 0.4) * 0.35);
  words.forEach(([id, at]) => { const p = clamp((t - at) / 0.4); $(id).style.opacity = clamp(p * 2); $(id).style.transform = `scale(${0.6 + 0.4 * pop(p)}) translateY(${(1 - p) * 20}px)`; });
  // compare: wrong sentence with a shake, then the right one
  const p1 = clamp((t - m.compare) / 0.4), sh = t > m.compare && t < m.compare + 0.7 ? Math.sin((t - m.compare) * 40) * 8 * (1 - (t - m.compare) / 0.7) : 0;
  $('cmp1').style.opacity = clamp(p1 * 1.5) * (1 - clamp((t - m.fixed) / 0.3));
  $('cmp1').style.transform = `translateX(${sh}px) translateY(${(1 - easeOut(p1)) * 40}px)`;
  const p2 = clamp((t - m.fixed) / 0.45);
  $('cmp2').style.opacity = clamp(p2 * 1.5); $('cmp2').style.transform = `translateY(${(1 - easeOut(p2)) * 40}px) scale(${0.92 + 0.08 * Math.min(1.05, pop(p2))})`;
  // captions follow the narration; progress bar along the bottom
  const c = T.captions.find((x) => t >= x.from && t < x.to);
  $('caption').style.opacity = c ? 1 : 0; if (c) $('caption').textContent = c.text;
  $('bar').style.width = `${clamp(t / T.duration) * 100}%`;
};
</script></body></html>
